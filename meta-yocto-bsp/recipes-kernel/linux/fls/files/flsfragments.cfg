CONFIG_SCSI_MOD=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_SPI_SPIDEV=y
CONFIG_SENSORS_LM70=y
CONFIG_SENSORS_MAX31760=y
CONFIG_SPI_MASTER=y
# AM335x serial aliases span ttyS0 through ttyS5. Reserve every slot so the
# FLS UARTs cannot occupy ttyS0 before the debug UART finishes probing.
CONFIG_SERIAL_8250_NR_UARTS=6
CONFIG_SERIAL_8250_RUNTIME_UARTS=6
CONFIG_WATCHDOG_NOWAYOUT=n
CONFIG_OMAP_WATCHDOG=y
CONFIG_USB_COMMON=y
CONFIG_USB=y
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_EHCI_HCD_PLATFORM=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_OHCI_HCD_PLATFORM=y
CONFIG_USB_STORAGE=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_DSPS=y
CONFIG_USB_MUSB_AM335X_CHILD=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_AM335X_CONTROL_USB=y
CONFIG_AM335X_PHY_USB=y
CONFIG_USB_GADGET=y
CONFIG_RTC_DRV_ISL1208=y
CONFIG_INPUT_EVDEV=y
CONFIG_EEPROM_AT24=y
CONFIG_EXPERT=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_SYSFS_LEGACY=y
CONFIG_DEVMEM=n
CONFIG_ARCH_HAS_DEVMEM_IS_ALLOWED=n
CONFIG_COMPAT_BRK=n
CONFIG_IKCONFIG=n
CONFIG_FORTIFY_SOURCE=y
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_STACKPROTECTOR=y
CONFIG_DEBUG_FS=n
# Block-I/O tracing selects DEBUG_FS even when DEBUG_FS itself is disabled.
# CONFIG_BLK_DEV_IO_TRACE is not set
# No dedicated MTD crash-log partition exists on the BeagleBone Black.
# CONFIG_MTD_OOPS is not set
CONFIG_SECURITY=y
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=-1
CONFIG_HARDENED_USERCOPY=y
CONFIG_IP_SCTP=n
CONFIG_INET_DIAG=n
CONFIG_SECURITY_YAMA=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_DEFAULT_MMAP_MIN_ADDR=32768
# CONFIG_BPF is not set
# CONFIG_BPF_SYSCALL is not set
# CONFIG_BPF_JIT is not set
# CONFIG_CGROUP_BPF is not set
# CONFIG_BPF_EVENTS is not set
# CONFIG_NET_SOCK_MSG is not set
